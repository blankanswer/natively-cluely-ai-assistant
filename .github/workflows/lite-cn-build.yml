name: Lite CN Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'native-module/**'
      - 'build/entitlements.mac.adhoc.plist'
      - 'scripts/build-electron-lite.js'
      - 'scripts/ad-hoc-sign.js'
      - 'vite.config.lite.mts'
      - 'electron-builder.lite.cjs'
      - '.github/workflows/lite-cn-build.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout Lite branch
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies without upstream postinstall
        shell: bash
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        shell: bash
        run: npx patch-package

      - name: Prepare native dependencies
        shell: bash
        run: |
          npm rebuild sharp
          node scripts/build-native.js
          node scripts/rebuild-native-electron.js
          node scripts/verify-native-arch.js

      - name: Build Lite renderer
        shell: bash
        run: |
          node node_modules/typescript7/lib/tsc.js -p tsconfig.json --noEmit
          npx vite build --config vite.config.lite.mts

      - name: Build Lite Electron main process
        shell: bash
        run: node scripts/build-electron-lite.js

      - name: Package Lite CN
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NATIVELY_LITE_CN: '1'
        run: node scripts/package-app.js --config electron-builder.lite.cjs --publish never

      - name: Verify packaged macOS app and ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find release -maxdepth 2 -type d -name 'Natively Lite CN.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'Natively Lite CN.app not found under release/' >&2
            exit 1
          fi

          echo "Verifying packed app: $APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1

          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          printf '%s\n' "$ENTITLEMENTS"
          if printf '%s' "$ENTITLEMENTS" | grep -q 'keychain-access-groups'; then
            echo 'Ad-hoc Lite app must not claim restricted keychain-access-groups entitlement.' >&2
            exit 1
          fi

          ZIP="$(find release -maxdepth 1 -type f -name '*mac-*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'macOS ZIP artifact not found under release/' >&2
            exit 1
          fi

          rm -rf /tmp/natively-lite-zip-smoke
          mkdir -p /tmp/natively-lite-zip-smoke
          ditto -x -k "$ZIP" /tmp/natively-lite-zip-smoke

          ZIP_APP="$(find /tmp/natively-lite-zip-smoke -maxdepth 2 -type d -name 'Natively Lite CN.app' -print -quit)"
          if [ -z "$ZIP_APP" ]; then
            echo 'Natively Lite CN.app not found after ZIP extraction' >&2
            exit 1
          fi

          echo "Verifying extracted ZIP app: $ZIP_APP"
          codesign --verify --deep --strict --verbose=4 "$ZIP_APP"
          file "$ZIP_APP/Contents/MacOS/Natively Lite CN"

      - name: Show package sizes
        if: always()
        shell: bash
        run: |
          if [ -d release ]; then
            find release -maxdepth 2 -type f -print || true
            du -sh release || true
          fi

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: natively-lite-cn-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
